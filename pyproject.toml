
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confido-voice-assistant"
version = "0.1.0"
description = "Voice-enabled front-desk assistant for the Confido take-home"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.30.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
  "requests>=2.31.0",
  "gradio>=4.36.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*", "core*"]
